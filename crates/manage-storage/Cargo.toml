[package]
name = "manage-storage"
edition.workspace = true
version.workspace = true
description = "Formato .manage (SQLite de un solo fichero) y sincronización con una copia compartida (SharePoint/Teams vía OneDrive)."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
