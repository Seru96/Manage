[package]
name = "manage"
edition.workspace = true
version.workspace = true
description = "IMPLANTA Manage: seguimiento de tareas e incidencias por proyecto"

[lib]
name = "manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
manage-storage = { path = "../crates/manage-storage" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
